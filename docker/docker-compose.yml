version: "3.9"

services:
  titan:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: titan
    restart: unless-stopped
    environment:
      - TITAN_ENVIRONMENT=production
      - TITAN_BROKER_PROVIDER=${TITAN_BROKER_PROVIDER:-paper}
      - TITAN_LOG_LEVEL=${TITAN_LOG_LEVEL:-INFO}
    env_file:
      - ../.env
    volumes:
      - titan-data:/app/data
      - titan-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import titan; print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  monitoring:
    image: prom/prometheus:latest
    container_name: titan-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    profiles:
      - monitoring

volumes:
  titan-data:
  titan-logs:
  prometheus-data:
