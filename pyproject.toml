[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-cli"
version = "1.0.0"
description = "Institutional Trading Intelligence System"
readme = "README.md"
requires-python = ">=3.14"

authors = [
    { name = "Eshu" }
]

dependencies = [
    "typer>=0.16.0",
    "rich>=14.0.0",
    "textual>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0"
]

[project.scripts]
titan = "titan.cli:app"

[tool.setuptools.packages.find]
include = ["titan*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.0",
    "black>=24.0.0",
    "mypy>=1.0.0"
]
broker = [
    "smartapi-python>=1.0.0",
    "pyotp>=2.0.0"
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true